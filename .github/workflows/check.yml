# Every suite in this repository is offline: no model, no network, no practice fleet. That is
# what makes CI possible at all — the interesting half of this project needs a GPU, and none of
# the checks do. A suite that starts needing one will fail here first, which is the right place
# to find out.
#
# The install is tested, not assumed. `pip install .` on a clean runner is the same path a
# stranger takes, and it is the path most likely to be broken by a change nobody thought was
# about packaging: a new dependency, a data file that stops shipping, a module that only
# imported because the repository happened to be the working directory.

name: check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# NOTHING THIS WORKFLOW DOES NEEDS TO WRITE. It installs the package, runs the guard and
# runs the suites; it opens no issue, pushes no commit and uploads no artifact. Without
# this block the job takes the repository's default token scope, which can be read/write
# — and this repository is public and accepts pull requests, so the cheapest thing to
# hand a workflow is the least it can do its job with.
#
# A fork's pull request already gets a read-only token whatever this says. The case this
# covers is a push to `main`, where the default would otherwise apply.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ${{ matrix.os }}
    # A ceiling, not a schedule. `tools/check.py` kills any single suite at its own
    # deadline and names it; this catches what that cannot reach — a wedged runner, an
    # install that never returns — instead of the job sitting for the six hours GitHub
    # allows by default and reporting as 'cancelled', which names nothing at all.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # THREE OPERATING SYSTEMS, because a portability assumption is invisible from whichever
        # one a change was written on. `Scripts/` versus `bin/`, a case-insensitive filesystem
        # forgiving a wrong import, a CRLF in a shell script — each of them works perfectly on
        # the machine it was typed on.
        #
        # And two interpreters: the oldest the package claims and the newest. The oldest is the
        # one that matters, because `requires-python = ">=3.9"` is a promise and the only way it
        # stays true is if something runs there. Paired down to one job per extra platform
        # rather than a full grid, since the OS risk and the version risk are different risks
        # and neither needs the other multiplied through it.
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }

    # BASH ON ALL THREE, or the Windows leg is a different script. GitHub's default shell there
    # is PowerShell, where `mkdir -p` and `$RUNNER_TEMP` do not mean what they mean below — so
    # the platform this job was added to test would be the one running something else.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      # FULL HISTORY, because the guard now checks WHO wrote each commit and whether its
        # stamp names a place, and `actions/checkout` fetches one commit by default. Those two
        # rules used to live only on `--range`, i.e. only in an optional local hook, which is
        # how an unrelated author and a local offset walk past every
        # gate that is not this one. A shallow clone
        # would make the check present and blind.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install as a stranger would
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: the command exists and knows itself
        run: |
          qatration --version
          qatration

      - name: the installed copy finds its own corpus
        # From a directory that is NOT the checkout, because the failure this catches is a
        # package that only works when the repository happens to be the working directory.
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          qatration lint

      - name: the commit guard, on the whole tree
        # The same script `.githooks/pre-commit` runs. A hook is advice: it can be skipped with
        # `--no-verify` and it does not exist until somebody runs `git config core.hooksPath
        # .githooks`. This is the part that cannot be skipped — a credential, a copyleft
        # dependency or text that must not be published reaching a pull request fails it here.
        #
        # `--selftest` first, and separately: it proves every pattern can still fire. A scanner
        # whose pattern has been mangled reports a clean tree, and this project has believed
        # three of those.
        run: |
          python tools/guard.py --selftest
          python tools/guard.py --tree

      - name: the practice fleet is startable on this platform
        # THE PART NO SUITE REACHES. The launcher and the bot servers need a model to do
        # anything, so nothing offline exercises them — and that is where today's two defects
        # were: `fleet.sh` resolved its interpreter inside a directory this repository does not
        # ship, so every subcommand exited 3 on a fresh clone, and two servers in `external/`
        # were still single-threaded after the other four were changed.
        #
        # Neither needed a model to catch. This is not a sweep: it proves the launcher parses,
        # resolves an interpreter and runs here, and that every server is still valid Python.
        # `ast.parse` rather than `import`, because two of them need smolagents and langchain,
        # which CI deliberately does not install.
        run: |
          bash -n tools/fleet.sh
          bash tools/fleet.sh status
          for s in httpbot/server.py draftbot/server.py \
                   external/guardedrag/server.py external/nemo/server.py \
                   foreign-agent/server.py foreign-agent/server_code.py \
                   foreign-langchain/server.py; do
            python -c "import ast,io,sys; ast.parse(io.open(sys.argv[1],encoding='utf-8').read())" "$s"
          done

      - name: suites
        run: python tools/check.py
