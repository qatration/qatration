models:
  - type: main
    engine: openai
    model: mistral-nemo
    parameters:
      base_url: http://localhost:11434/v1
      api_key: ollama
  # STRONGER GUARD: the self-check rails judge with a 24B model instead of the 12B bot
  - type: self_check_input
    engine: openai
    model: mistral-small
    parameters:
      base_url: http://localhost:11434/v1
      api_key: ollama
  - type: self_check_output
    engine: openai
    model: mistral-small
    parameters:
      base_url: http://localhost:11434/v1
      api_key: ollama

instructions:
